<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Senha - PetMatch</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Nunito',sans-serif;
}

/* CORES */

:root{
--verde:#2d8a60;
--laranja:#e8723a;
--cinza-bg:#f7f6f2;
--borda:#e4e0d8;
--texto:#2a2a2a;
--sombra:0 2px 12px rgba(0,0,0,0.08);
}

/* BODY */

body{

background:var(--cinza-bg);

display:flex;
flex-direction:column;

min-height:100vh;

}

/* HEADER */

header{

width:100%;
height:100px;

background:var(--verde);

display:flex;
align-items:center;
justify-content:center;

text-align:center;

}

.header-inner h1{

font-size:2rem;
font-weight:800;

color:white;

}

.header-sub{

font-size:0.9rem;

color:rgba(255,255,255,0.85);

}

/* CENTRAL */

main{

flex:1;

display:flex;

align-items:center;
justify-content:center;

padding:20px;

}

/* CARD */

.auth-card{

width:100%;
max-width:380px;

background:white;

padding:32px;

border-radius:18px;

box-shadow:var(--sombra);

border:1px solid var(--borda);

text-align:center;

}

/* TITULO */

.auth-card h2{

color:var(--verde);

margin-bottom:10px;

font-weight:800;

}

/* TEXTO */

.info-text{

font-size:14px;

color:#666;

margin-bottom:20px;

line-height:1.5;

}

/* INPUT */

.input-group{

margin-bottom:14px;

}

.input-group input{

width:100%;

padding:13px;

border-radius:10px;

border:1.5px solid var(--borda);

background:var(--cinza-bg);

font-size:14px;

transition:0.2s;

}

.input-group input:focus{

outline:none;

border-color:var(--verde);

box-shadow:0 0 0 3px rgba(45,138,96,0.15);

}

/* BOTÃO */

.btn-auth{

width:100%;

padding:13px;

border:none;

border-radius:10px;

background:var(--verde);

color:white;

font-weight:700;

font-size:15px;

cursor:pointer;

transition:0.2s;

}

.btn-auth:hover{

opacity:0.9;

transform:scale(0.98);

}

/* LINKS */

.auth-links{

margin-top:16px;

font-size:14px;

}

.auth-links a{

color:var(--laranja);

font-weight:600;

text-decoration:none;

}

.auth-links a:hover{

text-decoration:underline;

}

/* RESPONSIVO */

@media (max-width:420px){

.auth-card{
padding:24px;
}

}

</style>

</head>

<body>

<!-- HEADER -->

<header>

<div class="header-inner">

<h1>🐾 PetMatch</h1>

<p class="header-sub">

Recuperação de senha

</p>

</div>

</header>

<!-- CONTEÚDO -->

<main>

<div class="auth-card">

<h2>Nova senha</h2>

<p class="info-text">

Digite o token recebido e crie sua nova senha.

</p>

<form id="formNovaSenha">

<!-- TOKEN -->

<div class="input-group">

<input
type="text"
id="token"
placeholder="Digite o token"
required
>

</div>

<!-- NOVA SENHA -->

<div class="input-group">

<input
type="password"
id="senha"
placeholder="Nova senha"
required
>

</div>

<!-- CONFIRMAR -->

<div class="input-group">

<input
type="password"
id="confirmarSenha"
placeholder="Confirmar senha"
required
>

</div>

<!-- BOTÃO -->

<button
type="submit"
class="btn-auth">

Alterar senha

</button>

<!-- LINKS -->

<div class="auth-links">

<a href="login.html">

← Voltar ao login

</a>

</div>

</form>

</div>

</main>

<script>

const senhaRegex =
/^(?=.*[!@#$%^&*]).{6,}$/;

document
.getElementById("formNovaSenha")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const token =
document.getElementById("token").value;

const senha =
document.getElementById("senha").value;

const confirmarSenha =
document.getElementById("confirmarSenha").value;

const tokenSalvo =
localStorage.getItem("resetToken");

const email =
localStorage.getItem("resetEmail");

// VALIDA TOKEN

if(token !== tokenSalvo){

alert("Token inválido");
return;

}

// VALIDA SENHA

if(!senhaRegex.test(senha)){

alert(
"Senha precisa ter 6+ caracteres e símbolo"
);

return;

}

// CONFIRMA SENHA

if(senha !== confirmarSenha){

alert("As senhas não coincidem");
return;

}

// ENVIA PARA PHP

const resposta = await fetch(
"./petmatch-api/resetar-senha.php",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
novaSenha:senha
})

}
);

const data =
await resposta.json();

alert(data.message);

if(data.success){

localStorage.removeItem("resetToken");
localStorage.removeItem("resetEmail");

window.location.href =
"login.html";

}

});

</script>

</body>
</html>
